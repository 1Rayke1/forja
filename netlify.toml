[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/workout-plan"
  to = "/.netlify/functions/workout-plan"
  status = 200
  force = true

# Busca de vídeos de exercícios (YouTube Data API v3) via proxy seguro.
# A chave YOUTUBE_API_KEY fica somente no ambiente do backend.
[[redirects]]
  from = "/api/youtube-search"
  to = "/.netlify/functions/youtube-search"
  status = 200
  force = true

# Administração persistente das demonstrações do catálogo central.
[[redirects]]
  from = "/api/youtube-videos"
  to = "/.netlify/functions/youtube-videos"
  status = 200
  force = true

# A aba "Perfil" agora abre direto a tela de Configurações; a página
# intermediária perfil/index.html foi removida. Links/favoritos antigos
# continuam chegando ao destino certo (o fragmento é preservado pelo navegador).
[[redirects]]
  from = "/perfil"
  to = "/configuracoes/index.html"
  status = 301
  force = true

[[redirects]]
  from = "/perfil/*"
  to = "/configuracoes/index.html"
  status = 301
  force = true
