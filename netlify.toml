[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/workout-plan"
  to = "/.netlify/functions/workout-plan"
  status = 200
  force = true

[[redirects]]
  from = "/api/youtube-videos"
  to = "/.netlify/functions/youtube-videos"
  status = 200
  force = true
