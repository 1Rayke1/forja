<?xml version="1.0" encoding="UTF-8"?>
<!--
  FORJA — prancha anatômica de referência, vista posterior (cabeça aos pés).
  Escala ortográfica 240 × 520 (renderizada em 480 × 1040 px, 2× Retina).
  Tons neutros anatômicos: músculos em grafite-slate, tendões/fascias em cinza
  mineral, aponeurose toracolombar e tendão de Aquiles em cinzas claros.
  Sem numeração nem rótulos no corpo: os destaques funcionais são sobrepostos
  pela aplicação (forja-figura.js).
  Gerado neste repositório; derivada de acervo de referência anatômica aberta
  (BodyParts3D / Z-Anatomy, CC BY-SA). Veja assets/anatomia/NOTICE.md.
-->
