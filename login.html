<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050705">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Entrar · FORJA</title>
  <link rel="stylesheet" href="assets/css/login.css">
</head>
<body data-page="login" data-root="">
  <main class="login-screen" id="conteudo">
    <div class="login-hero" aria-hidden="true">
      <img src="assets/fotografias/login-hero.webp" alt="" decoding="async" fetchpriority="high">
    </div>
    <section class="login-actions" aria-label="Acesso ao FORJA">
      <svg class="login-mark" viewBox="0 0 64 64" width="30" height="30" aria-label="FORJA" role="img">
        <path fill="currentColor" d="M18 4 H52 L56 8 V16 H28 V28 H46 L50 32 V40 H28 V60 H18 Z"/>
      </svg>
      <button id="google-login" type="button" disabled>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.68-.22-2.48H12v4.69h6.46a5.52 5.52 0 0 1-2.39 3.62v3.01h3.87c2.26-2.08 3.58-5.15 3.58-8.84Z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.07 7.94-2.9l-3.87-3.01c-1.07.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.27v3.11A12 12 0 0 0 12 24Z"/>
          <path fill="#FBBC05" d="M5.27 14.28a7.2 7.2 0 0 1 0-4.56V6.61H1.27a12 12 0 0 0 0 10.78l4-3.11Z"/>
          <path fill="#EA4335" d="M12 4.76c1.76 0 3.34.61 4.58 1.8l3.44-3.44C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.69 1.27 6.61l4 3.11C6.22 6.87 8.87 4.76 12 4.76Z"/>
        </svg>
        <span>CONTINUAR COM O GOOGLE</span>
      </button>
      <p id="login-status" class="login-status" role="status" aria-live="polite">Verificando se você já está conectado…</p>
      <noscript><p class="login-noscript">Ative o JavaScript para entrar com Google. Não há acesso ao aplicativo sem autenticação.</p></noscript>
    </section>
  </main>
  <script src="assets/js/forja-core.js" defer></script>
  <script src="assets/js/forja-supabase-config.js" defer></script>
  <script src="assets/vendor/supabase/supabase.js" defer></script>
  <script src="assets/js/forja-auth.js" defer></script>
  <script src="assets/js/forja-login.js" defer></script>
</body>
</html>
