name: Coletar fotografias (interno)

# Workflow temporário de apoio: baixa os originais do Unsplash a partir dos ids
# registrados em tools/fotografias/coleta.json e devolve um artefato com as
# imagens e os metadados (autor, licença, marcação Unsplash+). Não publica nada
# e não altera o site.

on:
  push:
    paths:
      - "tools/fotografias/coleta.json"
      - ".github/workflows/coletar-fotografias.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Baixar originais e metadados
        run: node tools/fotografias/coletar.mjs --saida coletado
      - name: Resumo
        run: |
          echo "### Coleta de fotografias" >> $GITHUB_STEP_SUMMARY
          cat coletado/metadados.json >> $GITHUB_STEP_SUMMARY || true
      - uses: actions/upload-artifact@v4
        with:
          name: fotografias-coletadas
          path: coletado/
          retention-days: 7
          if-no-files-found: error
