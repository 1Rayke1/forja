name: Comparar motores 3D (Cycles vs EEVEE)

# Comparação técnica e visual controlada entre Blender Cycles e EEVEE usando os
# dois modelos 3D originais da release `modelos-3d-originais`.
#
# Regras desta etapa:
#   - Não altera nem substitui recursos publicados do app (`assets/`).
#   - Não faz merge nem push na `main`.
#   - Não avança para produção dos vídeos.
#   - Não aprova automaticamente um motor apenas por velocidade.

on:
  workflow_dispatch:
    inputs:
      largura:
        description: "Largura do render em pixels"
        required: false
        default: "720"
      altura:
        description: "Altura do render em pixels"
        required: false
        default: "960"
      amostras_cycles:
        description: "Amostras do Cycles"
        required: false
        default: "64"
      amostras_eevee:
        description: "Amostras TAA do EEVEE"
        required: false
        default: "64"
  push:
    branches:
      - "arena/**"
    paths:
      - ".github/workflows/comparar-motores-3d.yml"
      - "tools/blender/comparar-motores-3d.py"
      - "tools/resumir-comparacao-motores.mjs"

permissions:
  contents: write

concurrency:
  group: forja-comparar-motores-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comparar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LARGURA_RENDER: ${{ inputs.largura || '720' }}
      ALTURA_RENDER: ${{ inputs.altura || '960' }}
      AMOSTRAS_CYCLES: ${{ inputs.amostras_cycles || '64' }}
      AMOSTRAS_EEVEE: ${{ inputs.amostras_eevee || '64' }}
      SAIDA_COMPARACAO: docs/validacao-3d/comparacao-motores
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js 22 e dependências do projeto
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependências do repositório
        run: npm ci

      - name: Instalar bibliotecas de sistema e OpenGL por software (Mesa llvmpipe / EGL / Xvfb)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            file binutils unzip procps \
            xvfb xauth mesa-utils \
            libegl1 libgl1 libgl1-mesa-dri libglx-mesa0 libgbm1 \
            libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0 libsm6 libice6 >/dev/null

      - name: Instalar Blender 4.2.1 LTS oficial
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.1-linux-x64.tar.xz
          sudo mkdir -p /opt/blender-4.2.1
          sudo tar -xJf /tmp/blender.tar.xz -C /opt/blender-4.2.1 --strip-components=1
          sudo ln -sf /opt/blender-4.2.1/blender /usr/local/bin/blender
          blender --version

      - name: Instalar ferramentas Meshopt em diretório temporário isolado
        run: |
          set -euo pipefail
          mkdir -p /tmp/meshopt-tools
          cd /tmp/meshopt-tools
          npm init -y >/dev/null
          npm install --no-audit --no-fund \
            @gltf-transform/core@4.5.1 \
            @gltf-transform/extensions@4.5.1 \
            @gltf-transform/functions@4.5.1 \
            @gltf-transform/cli@4.5.1 \
            meshoptimizer@1.3.0 \
            draco3dgltf@1.5.9

      - name: Baixar anexos originais da release modelos-3d-originais
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/comparacao-3d/originais "${SAIDA_COMPARACAO}/logs"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/modelos-3d-originais" > /tmp/comparacao-3d/release.json
          gh release download "modelos-3d-originais" -D /tmp/comparacao-3d/originais --clobber
          ls -la /tmp/comparacao-3d/originais
          sha256sum /tmp/comparacao-3d/originais/*

          if grep -aq "KHR_texture_basisu" /tmp/comparacao-3d/originais/* 2>/dev/null; then
            echo "Extensão KHR_texture_basisu detectada; instalando KTX-Software para transcodificação real..."
            curl -sSL -o /tmp/ktx-software.deb \
              https://github.com/KhronosGroup/KTX-Software/releases/download/v4.3.2/KTX-Software-4.3.2-Linux-x86_64.deb
            sudo dpkg -i /tmp/ktx-software.deb || sudo apt-get install -f -y -qq
            ktx --version || true
          fi

      - name: Diagnóstico de Sistema, EGL, Xvfb e OpenGL no Blender 4.2.1
        id: opengl_check
        run: |
          set -uo pipefail
          mkdir -p /tmp/comparacao-3d "${SAIDA_COMPARACAO}/logs"
          LOG_GL="${SAIDA_COMPARACAO}/logs/opengl.log"
          : > "$LOG_GL"

          OS_NOME="$(. /etc/os-release && echo "${PRETTY_NAME}")"
          CPU_NOME="$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs || uname -p)"
          VCPUS="$(nproc)"
          RAM_MB="$(awk '/MemTotal:/ {printf "%.0f", $2/1024}' /proc/meminfo)"

          node -e '
            const fs = require("fs");
            fs.writeFileSync("/tmp/comparacao-3d/ambiente-sistema.json", JSON.stringify({
              os: process.argv[1],
              cpu: process.argv[2],
              vcpus: Number(process.argv[3]),
              ram_total_mb: Number(process.argv[4]),
              node: process.version
            }, null, 2));
          ' "$OS_NOME" "$CPU_NOME" "$VCPUS" "$RAM_MB"

          {
            echo "=== AMBIENTE DO RUNNER ==="
            echo "OS: $OS_NOME"
            echo "CPU: $CPU_NOME ($VCPUS vCPUs)"
            echo "RAM Total: ${RAM_MB} MiB"
            echo ""
            echo "=== EGLINFO (-B) ==="
            LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe eglinfo -B 2>&1 || echo "(eglinfo indisponível ou retornou erro)"
            echo ""
            echo "=== XVFB + GLXINFO (-B) ==="
            LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe \
              xvfb-run -a -s "-screen 0 1920x1080x24 +iglx" glxinfo -B 2>&1 || echo "(glxinfo retornou erro)"
          } >> "$LOG_GL"

          cat > /tmp/comparacao-3d/sonda_gl_blender.py << 'PY'
          import json, bpy, gpu
          cena = bpy.context.scene
          engines = [it.identifier for it in bpy.types.RenderSettings.bl_rna.properties["engine"].enum_items]
          cena.render.engine = "BLENDER_EEVEE_NEXT" if "BLENDER_EEVEE_NEXT" in engines else "BLENDER_EEVEE"
          cena.render.resolution_x = 32
          cena.render.resolution_y = 32
          if hasattr(cena.eevee, "taa_render_samples"):
              cena.eevee.taa_render_samples = 1
          cena.render.filepath = "/tmp/comparacao-3d/sonda_gl.png"
          bpy.ops.render.render(write_still=True)
          print("[SONDA_GL_JSON]", json.dumps({
              "engine": cena.render.engine,
              "vendor": gpu.platform.vendor_get(),
              "renderer": gpu.platform.renderer_get(),
              "version": gpu.platform.version_get(),
              "backend": gpu.platform.backend_type_get() if hasattr(gpu.platform, "backend_type_get") else None,
          }))
          PY

          echo "" >> "$LOG_GL"
          echo "=== SONDA BLENDER EEVEE HEADLESS PURO (EGL) ===" >> "$LOG_GL"
          EGL_OK=0
          if LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe \
             blender --background --factory-startup --python /tmp/comparacao-3d/sonda_gl_blender.py \
             > /tmp/comparacao-3d/sonda_egl.out 2>&1; then
            if grep -q '\[SONDA_GL_JSON\]' /tmp/comparacao-3d/sonda_egl.out; then
              EGL_OK=1
            fi
          fi
          cat /tmp/comparacao-3d/sonda_egl.out >> "$LOG_GL"

          echo "" >> "$LOG_GL"
          echo "=== SONDA BLENDER EEVEE COM XVFB (GLX/EGL) ===" >> "$LOG_GL"
          XVFB_OK=0
          if LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe \
             xvfb-run -a -s "-screen 0 1920x1080x24 +iglx" \
             blender --background --factory-startup --python /tmp/comparacao-3d/sonda_gl_blender.py \
             > /tmp/comparacao-3d/sonda_xvfb.out 2>&1; then
            if grep -q '\[SONDA_GL_JSON\]' /tmp/comparacao-3d/sonda_xvfb.out; then
              XVFB_OK=1
            fi
          fi
          cat /tmp/comparacao-3d/sonda_xvfb.out >> "$LOG_GL"

          USAR_XVFB="false"
          MODO_ESCOLHIDO="nenhum"
          LINHA_JSON=""
          if [ "$EGL_OK" -eq 1 ]; then
            MODO_ESCOLHIDO="headless_egl"
            USAR_XVFB="false"
            LINHA_JSON="$(grep '\[SONDA_GL_JSON\]' /tmp/comparacao-3d/sonda_egl.out | tail -1 | sed 's/^\[SONDA_GL_JSON\] //')"
          elif [ "$XVFB_OK" -eq 1 ]; then
            MODO_ESCOLHIDO="xvfb_run"
            USAR_XVFB="true"
            LINHA_JSON="$(grep '\[SONDA_GL_JSON\]' /tmp/comparacao-3d/sonda_xvfb.out | tail -1 | sed 's/^\[SONDA_GL_JSON\] //')"
          fi

          echo "usar_xvfb=${USAR_XVFB}" >> "$GITHUB_OUTPUT"
          node -e '
            const fs = require("fs");
            const sonda = process.argv[4] ? JSON.parse(process.argv[4]) : null;
            fs.writeFileSync("/tmp/comparacao-3d/opengl-ambiente.json", JSON.stringify({
              egl_headless_sucesso: process.argv[1] === "1",
              xvfb_sucesso: process.argv[2] === "1",
              modo_escolhido: process.argv[3],
              sonda_blender: sonda,
              resumo: sonda ? `${sonda.vendor} | ${sonda.renderer} | ${sonda.version} (${process.argv[3]})` : "indisponível"
            }, null, 2));
          ' "$EGL_OK" "$XVFB_OK" "$MODO_ESCOLHIDO" "$LINHA_JSON"

      - name: Inspecionar cabeçalho binário e testar compatibilidade Meshopt
        run: |
          set -euo pipefail
          FORJA_MESHOPT_DIR=/tmp/meshopt-tools \
            node tools/resumir-comparacao-motores.mjs \
              --modo preparar-meshopt \
              --originais-dir /tmp/comparacao-3d/originais \
              --release-json /tmp/comparacao-3d/release.json \
              --trabalho-dir /tmp/comparacao-3d/preparados \
              --log "${SAIDA_COMPARACAO}/logs/meshopt.log" \
              --saida-json /tmp/comparacao-3d/preparacao-modelos.json

      - name: Auditar importação real e compatibilidade de pose no Blender 4.2.1
        run: |
          set -euo pipefail
          blender --background --factory-startup \
            --python tools/blender/comparar-motores-3d.py -- \
            --modo auditar \
            --preparacao /tmp/comparacao-3d/preparacao-modelos.json \
            --clipe-forja assets/3d/animacoes/postura-base.glb \
            --log-importacao "${SAIDA_COMPARACAO}/logs/importacao.log" \
            --saida-json /tmp/comparacao-3d/auditoria-blender.json

      - name: Executar comparação controlada Cycles vs EEVEE (processos isolados)
        id: exec_comparacao
        continue-on-error: true
        run: |
          set -euo pipefail
          EXTRA_XVFB=""
          if [ "${{ steps.opengl_check.outputs.usar_xvfb }}" = "true" ]; then
            EXTRA_XVFB="--usar-xvfb"
          fi
          blender --background --factory-startup \
            --python tools/blender/comparar-motores-3d.py -- \
            --modo comparar \
            --auditoria /tmp/comparacao-3d/auditoria-blender.json \
            --saida-dir "${SAIDA_COMPARACAO}" \
            --saida-json /tmp/comparacao-3d/comparacao-bruta.json \
            --largura "${LARGURA_RENDER}" \
            --altura "${ALTURA_RENDER}" \
            --amostras-cycles "${AMOSTRAS_CYCLES}" \
            --amostras-eevee "${AMOSTRAS_EEVEE}" \
            ${EXTRA_XVFB}

      - name: Gerar relatórios JSON e Markdown com análise real dos PNGs
        run: |
          set -euo pipefail
          node tools/resumir-comparacao-motores.mjs \
            --modo resumir \
            --entrada /tmp/comparacao-3d/comparacao-bruta.json \
            --preparacao /tmp/comparacao-3d/preparacao-modelos.json \
            --opengl-json /tmp/comparacao-3d/opengl-ambiente.json \
            --ambiente-json /tmp/comparacao-3d/ambiente-sistema.json \
            --saida-json "${SAIDA_COMPARACAO}/relatorio-comparacao-motores.json" \
            --saida-md "${SAIDA_COMPARACAO}/relatorio-comparacao-motores.md"
          cat "${SAIDA_COMPARACAO}/relatorio-comparacao-motores.md" >> "$GITHUB_STEP_SUMMARY"
          ls -la "${SAIDA_COMPARACAO}" "${SAIDA_COMPARACAO}/logs"

      - name: Validar suíte de testes existente do FORJA
        run: npm test

      - name: Publicar artefato comparacao-motores-3d no GitHub Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparacao-motores-3d
          path: ${{ env.SAIDA_COMPARACAO }}
          if-no-files-found: error
          retention-days: 30

      - name: Gravar artefatos de validação no branch de trabalho (apenas arena/*)
        if: always() && startsWith(github.ref_name, 'arena/')
        run: |
          set -euo pipefail
          git config user.name "forja-comparacao-3d[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${SAIDA_COMPARACAO}"
          if git diff --cached --quiet; then
            echo "Sem novos artefatos para versionar."
            exit 0
          fi
          git commit -m "docs(validacao-3d): artefatos reais da comparação Cycles vs EEVEE"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Verificar resultado final da execução dos motores
        if: steps.exec_comparacao.outcome == 'failure'
        run: |
          echo "::warning::Um ou mais renders apresentaram falha; verifique os relatórios e logs gerados."
          exit 1
